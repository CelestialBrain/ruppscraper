name: Matrix Scraper Pipeline

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: ruppscraper-matrix-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Stage 1: Sharded parallel scraping across 10 parallel runner VMs
  # -------------------------------------------------------------------------
  shard-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "sort:new"
          - "sort:top"
          - "sort:hot"
          - "sort:rising"
          - "query:Math"
          - "query:Eng"
          - "query:Fil"
          - "query:Bio"
          - "query:Chem"
          - "query:Econ"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Shard Scrape (${{ matrix.shard }})
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          SHARD: ${{ matrix.shard }}
        run: |
          SHARD="${{ matrix.shard }}"
          SAFE_NAME=$(echo "$SHARD" | tr ':' '_')
          mkdir -p artifacts

          if [[ "$SHARD" == sort:* ]]; then
            SORT_TYPE="${SHARD#sort:}"
            python -m scraper scrape --sort "$SORT_TYPE" --limit 200 --comments 50
          elif [[ "$SHARD" == query:* ]]; then
            QUERY="${SHARD#query:}"
            python -m scraper scrape --sort new --query "$QUERY" --limit 100 --comments 50
          else
            echo "Unknown shard type: $SHARD" >&2
            exit 1
          fi

          python -m scraper stats
          # Fail sort shards on empty DB (backend death). Query shards may be
          # legitimately empty for sparse terms — export [] and continue.
          python - <<'PY'
          import os
          from scraper.database import get_connection, get_stats, init_db
          conn = get_connection()
          init_db(conn)
          stats = get_stats(conn)
          conn.close()
          print(stats)
          shard = os.environ.get("SHARD", "")
          if stats["total_posts"] == 0 and shard.startswith("sort:"):
              raise SystemExit("Sort shard produced 0 posts — fetch stack failed")
          PY

          python -m scraper export --format full -o "artifacts/shard_${SAFE_NAME}.json"

      - name: Upload Shard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ strategy.job-index }}
          path: artifacts/shard_*.json
          retention-days: 1

  # -------------------------------------------------------------------------
  # Stage 2: Merge shard results, match CRS database, export & commit
  # -------------------------------------------------------------------------
  merge-and-commit:
    needs: shard-scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: shard-*
          merge-multiple: true

      - name: Ingest shard JSONs into main database
        run: |
          python3 <<'PY'
          import glob
          import json
          from datetime import datetime

          from scraper.database import (
              get_connection,
              init_db,
              upsert_comment,
              upsert_post,
              upsert_professor,
          )
          from scraper.models import Comment, Post, Professor
          from scraper.parser import parse_title

          def parse_iso(ts: str | None) -> float:
              if not ts:
                  return 0.0
              try:
                  return datetime.fromisoformat(ts.replace("Z", "+00:00")).timestamp()
              except ValueError:
                  return 0.0

          conn = get_connection()
          init_db(conn)

          files = sorted(glob.glob("artifacts/shard_*.json"))
          print(f"Merging {len(files)} shard files...")

          for fpath in files:
              with open(fpath, "r") as f:
                  data = json.load(f)
              if not isinstance(data, list):
                  print(f"  skip {fpath}: not a list")
                  continue
              print(f"  {fpath}: {len(data)} posts")

              for item in data:
                  post_data = item["post"]
                  title = post_data["title"]
                  parsed = parse_title(title)

                  prof_id = None
                  if parsed is not None:
                      prof_id = parsed.professor_id
                      upsert_professor(
                          conn,
                          Professor(
                              id=prof_id,
                              last_name=parsed.last_name,
                              first_name=parsed.first_name,
                              campus=parsed.campus,
                          ),
                      )
                  else:
                      prof_data = item.get("professor") or {}
                      if prof_data.get("last_name"):
                          campus = item.get("campus") or "UPD"
                          last = prof_data["last_name"]
                          first = prof_data.get("first_name") or ""
                          # Keep merge resilient if parser still fails
                          from scraper.parser import _normalize_for_id

                          prof_id = (
                              f"{campus.lower()}__"
                              f"{_normalize_for_id(last)}__"
                              f"{_normalize_for_id(first)}"
                          )
                          upsert_professor(
                              conn,
                              Professor(
                                  id=prof_id,
                                  last_name=last,
                                  first_name=first,
                                  campus=campus,
                              ),
                          )

                  post = Post(
                      reddit_id=post_data["reddit_id"],
                      title=title,
                      campus=(parsed.campus if parsed else item.get("campus")),
                      course=(parsed.course if parsed else item.get("course")),
                      professor_id=prof_id,
                      url=post_data["url"],
                      score=int(post_data.get("score") or 0),
                      num_comments=int(post_data.get("num_comments") or 0),
                      created_utc=parse_iso(post_data.get("posted_at")),
                      author=post_data.get("author"),
                      selftext=post_data.get("body", "") or "",
                  )
                  upsert_post(conn, post)

                  for c in item.get("comments") or []:
                      comment = Comment(
                          reddit_id=c["reddit_id"],
                          post_reddit_id=post_data["reddit_id"],
                          parent_id=c.get("parent_id") or f"t3_{post_data['reddit_id']}",
                          author=c.get("author"),
                          body=c["body"],
                          score=int(c.get("score") or 0),
                          created_utc=parse_iso(c.get("posted_at")),
                          depth=int(c.get("depth") or 0),
                      )
                      upsert_comment(conn, comment)

          conn.commit()
          conn.close()
          print("Merge complete.")
          PY

      - name: Match against CRS & Export Final JSON
        run: |
          python -m scraper export --format professors --crs -o output/professors_crs.json
          python -m scraper export --format professors -o output/professors.json
          python -m scraper stats

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/professors_crs.json output/professors.json ruppscraper.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: matrix update prof reviews & CRS matches [$(date -u +%Y-%m-%d)]"
            git pull --rebase origin main || true
            git push
          fi
