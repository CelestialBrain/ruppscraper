name: RateUPProfs Scraper Pipeline

on:
  # Daily scrape lives in matrix-scrape.yml. Keep this for a sequential
  # scrape-all (reparse + enrich) when you want to run it by hand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruppscraper-commit
  cancel-in-progress: false

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ruppscraper
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          RUPP_PREFER_ARCTIC: "1"
          RUPP_COMMENT_WORKERS: "8"
          RUPP_COURTESY_DELAY: "0.1"
          RUPP_ARCTIC_PAGE_DELAY: "0.1"
        run: |
          python -m scraper scrape-all --scale 1.0
          python -m scraper reparse --all
          python -m scraper clean-junk
          python -m scraper enrich --limit 1500
          python -m scraper triage-reviews
          python -m scraper stats
          python - <<'PY'
          from scraper.database import get_connection, get_stats, init_db
          conn = get_connection(); init_db(conn); s = get_stats(conn); conn.close()
          print(s)
          if s["total_posts"] == 0:
              raise SystemExit("Scrape produced 0 posts")
          PY

      - name: Export Enriched JSON
        run: |
          python -m scraper export --format professors --crs -o output/professors_crs.json
          python -m scraper export --format professors -o output/professors.json
          python -m scraper export --format comments --crs -o output/comments_rupp_shaped.json

      - name: Commit updated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/professors_crs.json output/professors.json \
            output/comments_rupp_shaped.json ruppscraper.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update scraped prof reviews & CRS matches"
            git pull --rebase origin main || true
            git push
          fi
